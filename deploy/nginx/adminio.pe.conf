server {
    server_name adminio.pe www.adminio.pe;
    root /var/www/adminio.pe;
    include snippets/proteger-archivos.conf;
    index index.php index.html index.htm;

    access_log /var/log/nginx/adminio_access.log;
    error_log /var/log/nginx/adminio_error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Blog dinámico Bunzy (blog/index.php enruta /blog, /blog/<slug>, /blog/tag/<tag>, /blog/sitemap.xml)
    location = /blog.html {
        return 301 /blog;
    }

    location = /blog {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/blog/index.php;
        fastcgi_param SCRIPT_NAME /blog/index.php;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location ^~ /blog/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/blog/index.php;
        fastcgi_param SCRIPT_NAME /blog/index.php;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # El formulario de contacto usa config/envio_correo.php; el resto de config/, tools/ y vendor/ no es público
    location = /config/envio_correo.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location ~* ^/(config|model|db|vendor|tools)/ {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # Bloquear archivos ocultos como .env, .gitignore, etc.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Bloquear archivos sensibles
    location ~* /(composer\.json|composer\.lock|README\.md)$ {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/adminio.pe/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/adminio.pe/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    
    location = /files {
     return 301 /files/;
    }

    location ^~ /files/ {
    client_max_body_size 10M;

    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    }

}
server {
    if ($host = www.adminio.pe) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = adminio.pe) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name adminio.pe www.adminio.pe;
    return 404; # managed by Certbot




}
